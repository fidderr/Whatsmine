[package]
name = "whatsmine-core"
description = "WhatsMine core: identity, peer-to-peer networking, protocol and local storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bytes = "1"
anyhow = "1.0.104"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
iroh = "1"
iroh-mainline-address-lookup = "0.6.0"
iroh-mdns-address-lookup = "0.6.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
directories = "6.0.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
# Test data for the app scenarios (devtest/). Never in a build for users.
test-hooks = []

[dev-dependencies]
tempfile = "3"
