[package]
name = "whatsmine-core"
description = "WhatsMine core: identity, peer-to-peer networking, protocol and local storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
bytes = "1"
anyhow = "1.0.104"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
iroh = { version = "1", features = ["unstable-net-report"] }
iroh-mdns-address-lookup = "0.6.0"
postcard = { version = "1.1.3", features = ["use-std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7"] }
vodozemac = "0.11"
chacha20poly1305 = "0.11.0"
blake3 = "1.8.7"
bip39 = "3.0.0"
getrandom = "0.3"
n0-mainline = "0.7"
data-encoding = "2.11.1"
futures-lite = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
directories = "6.0.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[features]
# Test data for the app scenarios (devtest/). Never in a build for users.
test-hooks = []

[dev-dependencies]
tempfile = "3"
