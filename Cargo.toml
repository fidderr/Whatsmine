[workspace]
resolver = "3"
members = ["core", "cli", "apps/whatsmine", "tools/netlab"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["fidderr"]

# Size-first release builds, same reasoning as AlarmFree: the UI runs in a
# WebView, so native speed barely matters and the .so is the download size.
# `lto = "thin"`, not "fat": dx 0.7.10 on Windows writes its linker response
# file with unescaped backslashes and fat LTO trips over it.
[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

# `dx build --platform android` (debug) compiles with this profile. Unoptimised
# code makes hashing, encryption and image decoding painfully slow on a phone
# and a full-debuginfo APK is >600 MB, so keep it light but still debuggable.
[profile.android-dev]
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
# no dev-server hot-reload client or toast overlay in on-device builds
debug-assertions = false
