name: CI

on:
  push:
    branches: [master, rebuild]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: WhatsMine
      # The app builds against the SDK next to it: its branch of the same name if there is one.
      - name: Get mobile-sentinel
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git ls-remote --exit-code --heads https://github.com/fidderr/mobile-sentinel "$branch" || branch=main
          git clone --depth 1 --branch "$branch" https://github.com/fidderr/mobile-sentinel mobile-sentinel
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: WhatsMine
      - name: Dioxus desktop build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libasound2-dev
      - run: cargo fmt --all --check
        working-directory: WhatsMine
      - run: cargo clippy --workspace --all-targets --features whatsmine/desktop,whatsmine/test-hooks -- -D warnings
        working-directory: WhatsMine
      - run: cargo test --workspace --features whatsmine/test-hooks
        working-directory: WhatsMine

  android:
    name: android cross-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: WhatsMine
      - name: Get mobile-sentinel
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git ls-remote --exit-code --heads https://github.com/fidderr/mobile-sentinel "$branch" || branch=main
          git clone --depth 1 --branch "$branch" https://github.com/fidderr/mobile-sentinel mobile-sentinel
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: WhatsMine
      # rusqlite's bundled SQLite is C, so the build script needs the NDK's clang. The ubuntu
      # runner ships an NDK; API 31 matches minSdk.
      - name: Point cc at the preinstalled NDK
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android31-clang"
          echo "CC_aarch64_linux_android=$BIN/aarch64-linux-android31-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$BIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$BIN/aarch64-linux-android31-clang" >> "$GITHUB_ENV"
      - run: cargo clippy --target aarch64-linux-android -p whatsmine -p whatsmine-core --features whatsmine/mobile,whatsmine/test-hooks -- -D warnings
        working-directory: WhatsMine
