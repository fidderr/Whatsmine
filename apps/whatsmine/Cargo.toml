[package]
name = "whatsmine"
description = "WhatsMine: chat without servers, accounts or phone numbers. What's yours stays yours."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "whatsmine"
path = "src/lib.rs"

[[bin]]
name = "whatsmine"
path = "src/main.rs"

[dependencies]
whatsmine-core = { path = "../../core" }
dioxus = { version = "0.7", features = ["router"] }
chrono = "0.4"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["time", "sync", "rt"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
mobile-sentinel = { version = "0.4.0", path = "../../../mobile-sentinel", features = ["media_picker", "camera", "recorder", "share", "webview_media", "call_service", "background_service", "battery", "permissions", "display", "scanner", "network", "secure_storage", "biometric", "location"] }

[features]
default = []
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# What the test scenarios (devtest/) drive the app with. Never in a build for users.
test-hooks = ["whatsmine-core/test-hooks"]

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3.7.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
notify-rust = "4"
windows-registry = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.2.1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tempfile = "3"
