[package]
name = "whatsmine"
description = "WhatsMine: chat without servers, accounts or phone numbers. What's yours stays yours."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "whatsmine"
path = "src/lib.rs"

[[bin]]
name = "whatsmine"
path = "src/main.rs"

[dependencies]
whatsmine-core = { path = "../../core" }
dioxus = { version = "0.7", features = ["router"] }
chrono = "0.4"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
mobile-sentinel = { version = "0.2.2", path = "../../../mobile-sentinel", features = ["media_picker", "camera", "recorder", "share"] }

[features]
default = []
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3.7.0"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
tempfile = "3"
