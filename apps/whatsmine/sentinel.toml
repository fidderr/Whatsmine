# WhatsMine — mobile-sentinel build configuration, used by build_sentinel
# (run from the workspace root via ./build.sh android, which passes --app whatsmine).
#
# The package name comes from Dioxus.toml ([bundle] identifier). Capabilities
# are NOT listed here: build_sentinel derives them from the `mobile-sentinel`
# features in apps/whatsmine/Cargo.toml (media_picker, camera, recorder, share).

[android]
activity = "dev.dioxus.main.MainActivity"
icon = "apps/whatsmine/assets/icon.webp"
# Until the page has painted, the window and the splash screen: the light and dark `--bg` of
# style.css. Without them Android shows white, and a dark app flashes.
window_background = "F5F5FA"
window_background_dark = "12121A"

link_scheme = "whatsmine"
