[package]
name = "netlab"
description = "Measures what WhatsMine's connection plan rests on: NAT type, IPv6, relays, the DHT"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow = "1"
futures-lite = "2"
iroh = { version = "1", features = ["unstable-net-report"] }
n0-mainline = "0.7"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
