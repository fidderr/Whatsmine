<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WhatsMine</title>
<style>
  :root { color-scheme: dark light; --bg:#101218; --surface:#1b1e27; --text:#f2f3f7; --sub:#a9afbd; --primary:#7cb0ff; --on:#0b1526; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6f9; --surface:#fff; --text:#14161c; --sub:#585e6e; --primary:#1f5fd6; --on:#fff; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg); color:var(--text); font:16px/1.4 Roboto,'Segoe UI',system-ui,sans-serif; }
  main { width:100%; max-width:420px; display:flex; flex-direction:column; gap:16px; padding:24px; border-radius:16px; background:var(--surface); }
  h1 { margin:0; font-size:28px; line-height:1.3; }
  p { margin:0; color:var(--sub); }
  a.main { display:flex; align-items:center; justify-content:center; min-height:48px; border-radius:12px; background:var(--primary); color:var(--on); font-weight:500; text-decoration:none; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Someone invited you</h1>
  <p id="text">Open this invitation in WhatsMine. It stays on this device: the part after the # is never sent to this website.</p>
  <a class="main hidden" id="open" href="#">Open in WhatsMine</a>
  <p id="none" class="hidden">This link holds no invitation. Ask for a new one.</p>
</main>
<script>
  // Everything after the # stays in the browser: it never reaches any server.
  const code = location.hash.slice(1);
  const kind = location.pathname.includes('/join') ? 'join' : 'add';
  const open = document.getElementById('open');
  if (kind === 'join') document.getElementById('title').textContent = 'You are invited to a group';
  if (/^[a-z2-7]+$/i.test(code)) {
    open.href = 'whatsmine://' + kind + '/' + code;
    open.classList.remove('hidden');
  } else {
    document.getElementById('none').classList.remove('hidden');
    document.getElementById('text').classList.add('hidden');
  }
</script>
</body>
</html>
