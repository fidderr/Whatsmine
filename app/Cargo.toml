[package]
name = "whatsmine"
description = "WhatsMine: chat without servers, accounts or phone numbers. What's yours stays yours."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "whatsmine"
path = "src/lib.rs"

[[bin]]
name = "whatsmine"
path = "src/main.rs"

[dependencies]
whatsmine-core = { path = "../core" }
dioxus = { version = "0.7", features = ["router"] }
chrono = "0.4"
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }

[features]
default = []
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
